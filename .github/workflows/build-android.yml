name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          # Force expo-modules-core to use Compose Compiler 1.5.14 which is
          # compatible with Kotlin 1.9.24 (the version RN 0.76 uses).
          sed -i 's/kotlinCompilerExtensionVersion = versionsMap\[kotlinVersion()\]/kotlinCompilerExtensionVersion = "1.5.14"/' ../node_modules/expo-modules-core/android/build.gradle
          grep "kotlinCompilerExtensionVersion" ../node_modules/expo-modules-core/android/build.gradle || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-remote-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK for release
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/pi-remote.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Android Build"
          body: |
            Automated build of pi-remote Android debug APK.

            **Install:**
            1. Download `pi-remote.apk` below
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK and install
            4. You may see a Play Protect warning — tap **"Install anyway"
          files: dist/pi-remote.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
