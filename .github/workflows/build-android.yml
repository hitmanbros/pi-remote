name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Fix Kotlin version
        run: |
          cd android
          # buildscript.ext.kotlinVersion doesn't propagate to rootProject.ext
          # where expo-modules-core reads it. Add it to rootProject.ext directly.
          sed -i '/^apply plugin: "com.facebook.react.rootproject"/i rootProject.ext.kotlinVersion = "1.9.25"' build.gradle
          # React Native's libs.versions.toml pins kotlin to 1.9.24, which controls
          # the actual Kotlin Gradle Plugin version. Patch it to 1.9.25.
          sed -i 's/kotlin = "1.9.24"/kotlin = "1.9.25"/' ../node_modules/react-native/gradle/libs.versions.toml
          cat build.gradle | grep -n kotlinVersion || true
          grep "kotlin = " ../node_modules/react-native/gradle/libs.versions.toml || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug \
            -Pkotlin.compiler.suppressKotlinVersionCompatibilityCheck=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-remote-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Copy APK for release
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist/pi-remote.apk

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Android Build"
          body: |
            Automated build of pi-remote Android debug APK.

            **Install:**
            1. Download `pi-remote.apk` below
            2. Enable "Install from unknown sources" in Settings
            3. Open the APK and install
            4. You may see a Play Protect warning — tap **"Install anyway"
          files: dist/pi-remote.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
